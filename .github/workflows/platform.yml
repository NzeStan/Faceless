name: platform

on:
  push:
    paths: ["platform/**", "packages/**", "docker-compose.yml", ".github/workflows/platform.yml"]
  pull_request:
    paths: ["platform/**", "packages/**", "docker-compose.yml", ".github/workflows/platform.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: platform
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - run: pip install "../packages/django-social-publisher[celery,drf]"
      - run: |
          python -c "import tomllib; p=tomllib.load(open('pyproject.toml','rb'))['project']; print('\n'.join(x for x in p['dependencies']+p['optional-dependencies']['dev'] if not x.startswith('django-social-publisher')))" > /tmp/requirements.txt
          pip install -r /tmp/requirements.txt
      - run: ruff check .
      - run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - run: pytest

  production-image:
    # Dev tools can hide a missing runtime dependency from the test job, so check the image
    # without them: load the Celery broker transport and run Django's production checks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f platform/Dockerfile --target api -t faceless-api .
      - run: |
          docker run --rm \
            -e DJANGO_SETTINGS_MODULE=config.settings.prod \
            -e DJANGO_SECRET_KEY=ci-only-not-a-real-secret-ci-only-not-a-real-secret-0123456789 \
            -e DJANGO_ALLOWED_HOSTS=example.com \
            -e DATABASE_URL=postgres://u:p@localhost/db \
            -e REDIS_URL=redis://localhost:6379/0 \
            -e SOCIAL_TOKEN_ENCRYPTION_KEYS=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE= \
            -e S3_ACCESS_KEY=ci -e S3_SECRET_KEY=ci \
            faceless-api sh -c "python -c 'import kombu.transport.redis' && python manage.py check --deploy --fail-level WARNING"
