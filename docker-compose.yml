# Local development stack. Copy .env.example to .env first.
x-app: &app
  build: { context: ., dockerfile: platform/Dockerfile, target: api }
  env_file: .env
  environment: &app-env
    DJANGO_SETTINGS_MODULE: config.settings.dev
    DATABASE_URL: postgres://faceless:faceless@postgres:5432/faceless
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT_URL: http://minio:9000
    S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
    S3_BUCKET: faceless-media
    S3_ACCESS_KEY: minioadmin
    S3_SECRET_KEY: minioadmin
  volumes:
    - ./platform:/srv/platform
  depends_on: &app-deps
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    createbucket: { condition: service_completed_successfully }

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: faceless
      POSTGRES_USER: faceless
      POSTGRES_PASSWORD: faceless
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U faceless]
      interval: 5s
      retries: 20

  redis:
    image: redis:7
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 20

  minio:
    # The minio/minio and minio/mc repositories no longer exist on Docker Hub (checked Nov 2026).
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  createbucket:
    # The image has no shell for a healthcheck, so this command waits for MinIO itself.
    <<: *app
    command: python manage.py ensure_bucket
    depends_on:
      minio: { condition: service_started }

  migrate:
    <<: *app
    command: python manage.py migrate --noinput

  api:
    <<: *app
    command: python manage.py runserver 0.0.0.0:8000
    ports: ["8000:8000"]
    depends_on:
      <<: *app-deps
      migrate: { condition: service_completed_successfully }

  worker-ai:
    # Uses the render image in development only: the fake stock provider creates clips with
    # FFmpeg. In production this worker runs the api image.
    <<: *app
    build: { context: ., dockerfile: platform/Dockerfile, target: render }
    command: celery -A config worker -Q ai --concurrency 2 --hostname ai@%h --loglevel INFO
    depends_on:
      <<: *app-deps
      migrate: { condition: service_completed_successfully }

  worker-render:
    <<: *app
    build: { context: ., dockerfile: platform/Dockerfile, target: render }
    command: celery -A config worker -Q render --concurrency 1 --hostname render@%h --loglevel INFO
    depends_on:
      <<: *app-deps
      migrate: { condition: service_completed_successfully }

  worker-publish:
    <<: *app
    command: celery -A config worker -Q publish --concurrency 2 --hostname publish@%h --loglevel INFO
    depends_on:
      <<: *app-deps
      migrate: { condition: service_completed_successfully }

  beat:
    <<: *app
    command: celery -A config beat --loglevel INFO --schedule /tmp/celerybeat-schedule
    depends_on:
      <<: *app-deps
      migrate: { condition: service_completed_successfully }

  test:
    build: { context: ., dockerfile: platform/Dockerfile, target: test }
    profiles: [test]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://faceless:faceless@postgres:5432/faceless
    volumes:
      - ./platform:/srv/platform
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  postgres-data:
  minio-data:
