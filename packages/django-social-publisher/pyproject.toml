[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "django-social-publisher"
version = "0.1.0"
description = "Connect social accounts through official OAuth and publish video with capability awareness, idempotency and reconciliation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["django", "youtube", "oauth", "publishing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["Django>=5.2", "httpx>=0.27,<1", "cryptography>=42", "tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
celery = ["celery>=5.4"]
drf = ["djangorestframework>=3.15"]
dev = [
  "pytest>=8", "pytest-django>=4.9", "respx>=0.21", "ruff>=0.6", "mypy>=1.11",
  "django-stubs>=5.2", "djangorestframework-stubs>=3.15", "celery-types>=0.22", "psycopg[binary]>=3.2", "pip-audit>=2.7", "build>=1.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/social_publisher"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DJ", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107", "B018", "E402", "RUF059", "RUF012"]
"src/social_publisher/models.py" = ["RUF012"]
"src/social_publisher/contrib/drf/*" = ["RUF012"]
"src/social_publisher/migrations/*" = ["RUF012", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src/social_publisher"]
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "tests.settings"
